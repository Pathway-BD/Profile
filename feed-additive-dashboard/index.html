<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathway 사료첨가제 수출 인텔리전스</title>
<script src="common.js"></script>
<script src="estimate.js"></script>
<script src="chart.umd.js"></script>
<style>
:root{--ink:#37352f;--ink2:#6b6a66;--mute:#9b9a97;--line:#e9e9e7;--soft:#f7f6f3;--hover:#efefed;--brand:#0f5c43;--brand-2:#e7f1ec;--up:#0f7b4f;--down:#c2410c;--new:#7c3aed}
*{box-sizing:border-box}html,body{margin:0}
html{scroll-behavior:smooth}
body{background:#fff;color:var(--ink);font:15px/1.65 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.page{max-width:920px;margin:0 auto;padding:56px 24px 80px}
.icon{font-size:64px;line-height:1}
h1{font-size:34px;line-height:1.25;margin:14px 0 6px;letter-spacing:-.02em;word-break:keep-all}
.subtitle{color:var(--ink2);font-size:14px}
section{margin-top:44px;scroll-margin-top:16px}
h2{font-size:21px;margin:0 0 14px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 10px}
.muted{color:var(--mute);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;transition:background .12s}
.chip:hover{background:var(--hover)}
.up{color:var(--up)}.down{color:var(--down)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.box{border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.cbox{position:relative;height:200px}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 6px;border-radius:6px}
a.row:hover{background:var(--hover)}
.row .no{color:var(--mute);font-weight:700;text-align:center}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-size:13px;white-space:nowrap}
.row .r b{font-size:14px}
.chg{font-size:12px;margin-left:4px}
.badge{font-size:11px;padding:1px 6px;border-radius:4px;background:#f1ebfd;color:var(--new);font-weight:700}
.reg{display:block;padding:6px;border-radius:6px}
a.reg:hover{background:var(--hover)}
.reg .top{display:flex;justify-content:space-between;font-size:14px}
.reg .t{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:4px}
.reg .t i{display:block;height:100%;background:var(--brand);border-radius:99px}
.callout{display:flex;gap:12px;background:var(--soft);border-radius:8px;padding:16px 18px;margin-top:14px;align-items:flex-start}
.callout .e{font-size:22px;line-height:1.3}
.callout .txt{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.btn:hover{background:var(--hover)}
.list a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:7px 6px;border-radius:6px;align-items:center}
.list a:hover{background:var(--hover)}
.list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .r{font-size:13px;color:var(--ink2);text-align:right;white-space:nowrap}
.none{color:var(--mute);font-size:14px;padding:6px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.step{background:var(--soft);border-radius:8px;padding:12px 14px}
.step b{display:block;font-size:14px}.step div{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.55}
.step .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:700;margin-right:6px;vertical-align:1px}
ul.facts{margin:8px 0 0;padding-left:20px;color:var(--ink2);font-size:14px}
ul.facts li{margin:3px 0}
hr{border:0;border-top:1px solid var(--line);margin:44px 0 0}
.err{background:#fef3f2;border:1px solid #fecdca;color:#7a271a;border-radius:10px;padding:16px 18px;margin-top:24px}
.foot{margin-top:40px;color:var(--mute);font-size:12px}
.tw{overflow-x:auto;margin:0 -6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid #f1f1ef;text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:500}
th.l,td.l{text-align:left}
tr.go{cursor:pointer}tr.go:hover td{background:var(--hover)}
td .alt{display:block;color:var(--mute);font-size:12px}
.conf{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px}
.conf.h{background:#dcfce7;color:#166534}.conf.m{background:#fef9c3;color:#854d0e}.conf.lo{background:#f3f4f6;color:#4b5563}.conf.mix{background:#eef2ff;color:#4338ca}
.tbar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:4px}.tbar i{display:block;height:100%;background:var(--brand)}
.bigs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.big{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:18px;transition:background .12s,box-shadow .12s}
.big:hover{background:var(--soft);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.big .e{font-size:28px;line-height:1}
.big b{display:block;font-size:16px;margin-bottom:2px}
.big .d{display:block;color:var(--mute);font-size:13px;line-height:1.5}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:8px;padding:4px 6px;margin:0 -6px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:hover{background:var(--hover)}
details.fold>summary h2{margin:0}
details.fold>summary .arr{color:var(--mute);transition:transform .15s;font-size:14px}
details.fold[open]>summary .arr{transform:rotate(90deg)}
details.fold>.inner{margin-top:14px}
@media(max-width:760px){
  .page{padding:32px 16px 60px}
  h1{font-size:26px}.icon{font-size:48px}
  .grid2,.bigs{grid-template-columns:1fr}
  .hide-m{display:none}
  .flow{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="page">
  <div class="icon">✈️</div>
  <h1>Pathway 사료첨가제 수출 인텔리전스</h1>
  <div class="subtitle" id="subtitle">관세청 무역통계 · HS 2309.90-30</div>
  <div id="app"></div>
</div>

<script>
/* External link slots — fill in url to show them (section hides when every url is empty) */
const EXTERNAL_LINKS=[
  {emoji:'📝',label:'Notion 워크스페이스',url:''},
  {emoji:'🏢',label:'회사 홈페이지',url:''},
  {emoji:'📮',label:'문의·공유 채널',url:''},
];

const D='dashboard.html';
const dl=o=>D+'#'+Object.entries(o).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
const cnm=(CN,c)=>CN[c]||c;
const hasBatchim=w=>{const ch=String(w).trim().slice(-1).charCodeAt(0);return ch>=0xAC00&&ch<=0xD7A3?(ch-0xAC00)%28>0:false};
const ga=w=>w+(hasBatchim(w)?'이':'가');           // 주격 조사 이/가
const joinKo=a=>a.length<=1?a.join(''):a.slice(0,-1).join('·')+'·'+a[a.length-1];

/* Sum rows into {usd,kg} per key */
function sumBy(rows,key){const m={};for(const r of rows){const k=key(r);(m[k]=m[k]||{usd:0,kg:0}).usd+=r.usd;m[k].kg+=r.kg}return m}
const rank=m=>Object.keys(m).sort((a,b)=>m[b].usd-m[a].usd);

function build(CN,DATA){
  const rows=DATA.rows.map(([m,c,h,usd,kg])=>({m,c,h,usd,kg}));
  const L=parseM(DATA.latest),Lk=mkey(L),Pk=mkey(addM(L,-1));
  const inMonths=ks=>{const s=new Set(ks);return rows.filter(r=>s.has(r.m))};
  const months=(from,n)=>Array.from({length:n},(_,i)=>mkey(addM(from,i)));
  const last12=months(addM(L,-11),12),prev12=months(addM(L,-23),12);

  $('#subtitle').textContent=`관세청 무역통계 · HS 2309.90-30 · 데이터 ${DATA.latest}까지 · 갱신 ${DATA.updated}`;

  // Latest month
  const cur=inMonths([Lk]);
  const U=cur.reduce((s,r)=>s+r.usd,0),W=cur.reduce((s,r)=>s+r.kg,0);
  const byC=sumBy(cur,r=>r.c),order=rank(byC);
  const byPrev=sumBy(inMonths([Pk]),r=>r.c),prevOrder=rank(byPrev);

  // New in latest month = no exports in the 12 months before it
  const before=new Set(inMonths(months(addM(L,-12),12)).map(r=>r.c));
  const freshNow=order.filter(c=>!before.has(c));

  // 12-month volume bars
  const mTot=sumBy(inMonths(last12),r=>r.m);

  // Product-type estimates (repeat signals use every month, so estimate all rows then keep the latest month)
  const curE=estimateRows(rows).filter(r=>r.m===Lk).sort((a,b)=>b.kg-a.kg);
  const byType={};
  for(const r of curE){const t=r.cands[0];const o=byType[t.n]=byType[t.n]||{t,kg:0,usd:0,lo:1e9,hi:0,c:[]};
    o.kg+=r.kg;o.usd+=r.usd;o.lo=Math.min(o.lo,r.p);o.hi=Math.max(o.hi,r.p);if(!o.c.includes(r.c))o.c.push(r.c)}
  const typeOrder=Object.keys(byType).sort((a,b)=>byType[b].kg-byType[a].kg);
  const pr=o=>o.hi-o.lo<.005?`${fPv(o.lo)}/kg`:`${fPv(o.lo)}–${fPv(o.hi)}/kg`;

  // Region share, last 12 months
  const r12=inMonths(last12),T12=r12.reduce((s,r)=>s+r.usd,0);
  const byR=sumBy(r12,r=>regOf(r.c)),regs=rank(byR);

  // New / lost markets: last 12 vs previous 12
  const curP=sumBy(r12,r=>r.c),prvRows=inMonths(prev12),prvP=sumBy(prvRows,r=>r.c);
  const firstM={},lastM={};
  for(const r of r12)if(!firstM[r.c]||r.m<firstM[r.c])firstM[r.c]=r.m;
  for(const r of prvRows)if(!lastM[r.c]||r.m>lastM[r.c])lastM[r.c]=r.m;
  const newM=rank(curP).filter(c=>!prvP[c]),lostM=rank(prvP).filter(c=>!curP[c]);

  // One-line summary (plain text so it copies cleanly)
  let line='';
  if(W>0){
    line=`${korM(Lk)}에는 ${order.length}개국에 ${fMT(W)}가 나갔습니다.`;
    const tt=byType[typeOrder[0]];
    if(tt)line+=` 물량 기준으로 가장 많이 나간 추정 첨가제는 ${tt.t.k}(${pr(tt)}, ${fMT(tt.kg)})입니다.`;
    const top=cnm(CN,order[0]),fresh=freshNow.slice(0,3).map(c=>cnm(CN,c));
    line+=fresh.length?` ${ga(top)} 금액 1위이며, ${ga(joinKo(fresh))} 새로 수출국에 들어왔습니다.`:` ${ga(top)} 금액 1위입니다.`;
  }

  let h='';

  // 2. Shortcuts
  h+=`<section><h2>🧭 바로가기</h2><div class="chips">
    <a class="chip" href="#summary">📌 이번 달 요약</a>
    <a class="chip" href="${dl({scope:'mine'})}">🎯 담당 시장</a>
    <a class="chip" href="#markets">🆕 신규 시장</a>
    <a class="chip" href="#about">📘 데이터 설명</a>
    <a class="chip" href="${D}">📊 전체 대시보드</a></div></section>`;

  // 3. At a glance: where it went, how much, at what unit price, and which additive that price points to
  const newTag=c=>before.has(c)?'':' <span class="badge">신규 국가</span>';
  if(curE.length){
    h+=`<section id="summary"><h2>📊 한눈에 보기 <span class="muted" style="font-weight:400">${korM(Lk)} · ${order.length}개국 · ${fMT(W)}</span></h2>
    ${line?`<div class="callout" style="margin-top:0"><div class="e">💬</div><div class="txt"><b>이번 달 한 줄 요약</b><div id="line" style="margin-top:4px">${esc(line)}</div></div><button class="btn" id="copy">복사</button></div>`:''}
    <div class="box" style="margin-top:14px"><h3>🌐 나라별 수출 · 추정 첨가제 <span class="muted" style="font-weight:400">물량 순 · 단가 USD/kg · 누르면 그 나라 상세</span></h3>
      <div class="tw"><table><thead><tr><th class="l">나라</th><th class="l hide-m">세부 품목</th><th>물량</th><th>단가</th><th class="l">추정 첨가제</th><th class="l hide-m">추정 근거</th></tr></thead><tbody>
      ${curE.map(r=>`<tr class="go" data-href="${dl({c:r.c,per:'m:'+Lk.replace('.','')})}"><td class="l"><b>${esc(cnm(CN,r.c))}</b>${newTag(r.c)}</td><td class="l hide-m" style="color:var(--ink2)">${esc(ITEM_LABEL[r.h]||r.h)}</td><td class="num">${fMT(r.kg)}</td><td class="num"><b>${fPv(r.p)}</b></td><td class="l"><b>${esc(r.cands[0].k)}</b><span class="alt">${esc(r.cands[0].n)}${r.cands[1]?' · 또는 '+esc(r.cands[1].k):''}</span></td><td class="l hide-m"><span class="conf ${r.conf}">${r.conf==='mix'?'혼합 (평균 단가)':'단일 제품 '+CONF_LABEL[r.conf]}</span></td></tr>`).join('')}
      </tbody></table></div>
      <div class="muted" style="margin-top:8px">추정 첨가제는 단가를 벌크 거래 단가대에 대입한 추정입니다. '혼합'은 물량이 MT 단위로 떨어지지 않아 여러 건이 섞인 평균 단가로 본 건입니다.</div></div>
    <div class="grid2">
      ${typeOrder.length?`<div class="box"><h3>🧪 추정 첨가제 구성 <span class="muted" style="font-weight:400">물량 기준</span></h3>
        ${typeOrder.map(k=>{const o=byType[k];return`<a class="reg" href="trends.html"><div class="top"><span><b>${esc(o.t.k)}</b> <span class="muted">${pr(o)}</span></span><span class="num">${fMT(o.kg)} · <b>${(o.kg/W*100).toFixed(0)}%</b></span></div><div class="tbar"><i style="width:${o.kg/byType[typeOrder[0]].kg*100}%"></i></div><div class="muted" style="margin-top:2px">${o.c.map(c=>esc(cnm(CN,c))).join(', ')}</div></a>`}).join('')}</div>`:''}
      <div class="box"><h3>🔥 인기 국가 Top 5 <span class="muted" style="font-weight:400">금액 기준 · 순위는 전월 대비</span></h3>
        ${order.slice(0,5).map((c,i)=>{const p=prevOrder.indexOf(c),d=p<0?null:p-i;
          const chg=d==null?'<span class="chg" style="color:var(--mute)">전월 없음</span>':d>0?`<span class="chg up">▲${d}</span>`:d<0?`<span class="chg down">▼${-d}</span>`:'<span class="chg" style="color:var(--mute)">–</span>';
          return`<a class="row" href="${dl({c})}"><span class="no">${i+1}</span><span class="nm">${esc(cnm(CN,c))}${newTag(c)} ${chg}</span><span class="r num"><b>${fUSD(byC[c].usd)}</b> · ${(byC[c].usd/U*100).toFixed(0)}%</span></a>`}).join('')}
      </div>
    </div>
    <div class="grid2">
      ${Object.keys(mTot).length?`<div class="box"><h3>월별 물량 <span class="muted" style="font-weight:400">최근 12개월 · MT · 막대를 누르면 그 달 상세</span></h3><div class="cbox"><canvas id="ch"></canvas></div></div>`:''}
      ${T12>0?`<div class="box"><h3>🌍 지역 비중 <span class="muted" style="font-weight:400">최근 12개월 금액 · 누르면 그 지역만</span></h3>
        ${regs.map(k=>`<a class="reg" href="${dl({scope:k})}"><div class="top"><span>${esc(k)}</span><span class="num">${fUSD(byR[k].usd)} · <b>${(byR[k].usd/T12*100).toFixed(1)}%</b></span></div><div class="t"><i style="width:${byR[k].usd/byR[regs[0]].usd*100}%"></i></div></a>`).join('')}</div>`:''}
    </div>
    </section>`;
  }

  // Big buttons into the detail pages
  const big=(e,l,d,href)=>`<a class="big" href="${href}"><span class="e">${e}</span><span><b>${l}</b><span class="d">${d}</span></span></a>`;
  h+=`<section><h2>🚀 더 자세히 보기</h2><div class="bigs">
    ${big('📊','세부 수출기록 확인하기','나라·지역·세부 품목·월별 수출 기록을 표와 차트로','dashboard.html')}
    ${big('📈','첨가제별 동향','추정 첨가제 유형별 월별 물량·단가·주요 국가','trends.html')}
    ${big('🔎','제품 추정 시나리오','단일 제품으로 보이는 건만 골라 추정 근거와 함께','scenario.html')}
  </div></section>`;

  // 4. New / lost markets
  h+=`<section id="markets"><h2>🆕 신규 · 이탈 시장 <span class="muted" style="font-weight:400">최근 12개월 vs 그 전 12개월</span></h2><div class="grid2" style="margin-top:0">
    <div class="box"><h3>🌱 신규 시장 <span class="muted" style="font-weight:400">${newM.length}개국 · 이전 12개월엔 실적 없음</span></h3><div class="list">
      ${newM.length?newM.map(c=>`<a href="${dl({c})}"><span class="nm">${esc(cnm(CN,c))}</span><span class="r">첫 수출 ${firstM[c]} · <b>${fUSD(curP[c].usd)}</b></span></a>`).join(''):'<div class="none">해당 없음</div>'}</div></div>
    <div class="box"><h3>🍂 이탈 시장 <span class="muted" style="font-weight:400">${lostM.length}개국 · 최근 12개월 실적 없음</span></h3><div class="list">
      ${lostM.length?lostM.map(c=>`<a href="${dl({c,per:'m:'+lastM[c].replace('.','')})}"><span class="nm">${esc(cnm(CN,c))}</span><span class="r">마지막 ${lastM[c]} · 이전 ${fUSD(prvP[c].usd)}</span></a>`).join(''):'<div class="none">해당 없음</div>'}</div></div>
  </div></section>`;

  // 6. About the data
  h+=`<section id="about"><details class="fold" id="aboutD"><summary><span class="arr">▶</span><h2>📘 이 데이터는 어디서 오나요?</h2><span class="muted">누르면 펼쳐집니다</span></summary><div class="inner">
    <p style="margin:0;color:var(--ink2)">우리나라에서 물건을 해외로 팔 때는 반드시 <b>세관(관세청)에 수출신고</b>를 해야 합니다. 신고서에는 <b>무슨 물건인지(HS코드)</b>, <b>어느 나라로</b>, <b>몇 kg</b>, <b>얼마(달러)</b>에 보내는지가 적힙니다. 관세청은 이 신고서를 매달 모아 합계를 공개하고, 이 페이지는 그 공개 자료를 자동으로 불러와 보여줍니다.</p>
    <div class="flow">
      <div class="step"><b><span class="n">1</span>수출신고</b><div>회사가 물건을 보낼 때 세관에 품목·나라·무게·금액을 신고</div></div>
      <div class="step"><b><span class="n">2</span>관세청 집계</b><div>한 달 동안의 신고를 나라별·품목별로 더해 통계로 만듦</div></div>
      <div class="step"><b><span class="n">3</span>공공데이터 공개</b><div>매달 15일쯤 지난달 통계를 공공데이터포털(API)에 공개</div></div>
      <div class="step"><b><span class="n">4</span>이 페이지</b><div>매달 16~20일 '사료첨가제' 번호만 자동으로 받아와 정리</div></div>
    </div>
    <div id="hs" style="scroll-margin-top:16px"><h3>🔢 HS코드 안내</h3>
    <ul class="facts">
      <li><b>2309.90-30</b> = 관세율표상 이름 그대로 <b>'사료첨가제'</b>로 분류된 항목입니다. 세부 품목: ${Object.values(ITEM_LABEL).join(' · ')}</li>
      <li>회사별 내역은 공개되지 않으며, <b>한국 전체의 합계</b>입니다.</li>
      <li><b>평균단가 = 금액 ÷ 중량</b> (USD/kg). 같은 제품이라도 다른 HS코드로 신고되면 집계되지 않습니다.</li>
    </ul></div>
    <div id="updates" class="callout" style="scroll-margin-top:16px"><div class="e">🔄</div><div class="txt"><b>업데이트 기록</b><div class="muted" style="font-size:14px;margin-top:2px">데이터 ${esc(DATA.latest)}까지 · 마지막 갱신 ${esc(DATA.updated)} · 매달 16~20일 오전 10시 자동 갱신<br>출처: ${esc(DATA.source||'관세청 품목별 국가별 수출입실적')} · <a href="${LINK}" target="_blank" rel="noopener" style="text-decoration:underline">공공데이터포털</a></div></div></div>
  </div></details></section>`;

  // 7. External links
  const ext=EXTERNAL_LINKS.filter(x=>x.url);
  if(ext.length)h+=`<section><h2>🔗 외부 바로가기</h2><div class="chips">${ext.map(x=>`<a class="chip" href="${esc(x.url)}" target="_blank" rel="noopener">${x.emoji} ${esc(x.label)}</a>`).join('')}</div></section>`;

  $('#app').innerHTML=h;

  // Anchors into the folded data section open it first
  const openAbout=()=>{if(['#about','#hs','#updates'].includes(location.hash)){$('#aboutD').open=true;document.querySelector(location.hash)?.scrollIntoView()}};
  window.addEventListener('hashchange',openAbout);openAbout();
  document.querySelectorAll('a[href="#about"]').forEach(a=>a.addEventListener('click',()=>{$('#aboutD').open=true}));
  document.querySelectorAll('tr[data-href]').forEach(tr=>tr.onclick=()=>location.href=tr.dataset.href);

  if($('#copy'))$('#copy').onclick=()=>{
    const done=()=>{$('#copy').textContent='복사됨 ✓';setTimeout(()=>$('#copy').textContent='복사',1500)};
    (navigator.clipboard?.writeText(line)||Promise.reject()).then(done).catch(()=>{const t=document.createElement('textarea');t.value=line;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();done()});
  };
  if($('#ch')){
    const labels=last12,vals=last12.map(k=>(mTot[k]?.kg||0)/1000);
    new Chart($('#ch'),{type:'bar',data:{labels:labels.map(k=>k.slice(2)),datasets:[{data:vals,backgroundColor:labels.map(k=>k===Lk?'#0f5c43':'#9cc9b6'),borderRadius:3}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:it=>korM(labels[it[0].dataIndex]),label:c=>` ${c.parsed.y.toLocaleString(undefined,{maximumFractionDigits:1})} MT`}}},
        scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{border:{display:false},grid:{color:'#f1f1ef'},ticks:{font:{size:11},callback:v=>`${v.toLocaleString()} MT`}}},
        onHover:(e,els)=>{e.native.target.style.cursor=els.length?'pointer':'default'},
        onClick:(e,els)=>{if(els.length)location.href=dl({per:'m:'+labels[els[0].index].replace('.','')})}}});
  }
}

if(location.protocol==='file:')$('#app').innerHTML='<div class="err"><b>파일을 직접 열면 데이터를 읽을 수 없습니다.</b><br>GitHub Pages 주소로 접속하거나, 이 폴더에서 <code>python -m http.server</code> 실행 후 http://localhost:8000 으로 여세요.</div>';
else loadData().then(({CN,DATA})=>build(CN,DATA)).catch(()=>{
  $('#app').innerHTML='<div class="err"><b>아직 데이터가 만들어지지 않았습니다.</b><br>관세청 데이터 파일(data/feed_additive.json)이 생성되기 전입니다. GitHub 저장소의 Actions 탭 → <b>Update customs data</b> → <b>Run workflow</b>를 실행하고 몇 분 뒤 새로고침해 주세요.</div>';
});
</script>
</body>
</html>
