<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Export Intelligence · Pathway 사료첨가제 수출</title>
<script src="common.js"></script>
<script src="estimate.js"></script>
<script src="world.js"></script>
<script src="chart.umd.js"></script>
<style>
:root{--navy:#0b2559;--navy2:#1e3a8a;--ink:#111827;--ink2:#4b5563;--mute:#8a94a6;--line:#e5e9f0;--soft:#f5f7fb;--blue-soft:#eef3fc;--new:#e11d48;--up:#15803d;--down:#c2410c}
*{box-sizing:border-box}html,body{margin:0}
body{background:#fff;color:var(--ink);font:14px/1.5 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.page{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:14px}
.top h1{margin:0;font-size:30px;letter-spacing:-.02em;color:var(--navy);font-weight:800}
.top h1 span{color:#8aa0c8;font-weight:700}
.top .sub{color:var(--ink2);font-size:13.5px;margin-top:4px}
.top .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;cursor:pointer}
.top .meta{font-size:12px;color:var(--mute)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(15,30,70,.05);padding:16px 18px;min-width:0}
.ttl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.ttl h2{margin:0;font-size:15px;color:var(--navy);letter-spacing:.01em}
.ttl .u{font-size:12px;color:var(--mute)}
.ttl a.more{margin-left:auto;font-size:12px;color:var(--navy2);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.ttl a.more:hover{background:var(--soft)}
.row1{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr 1.6fr;gap:12px;margin-top:18px}
.kpi .l{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--mute)}
.kpi .v{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:6px;color:var(--navy)}
.kpi .s{font-size:12.5px;color:var(--ink2);margin-top:2px}
.kpi.hero{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.hero .l{color:#9fb3da}.kpi.hero .v{color:#fff;font-size:42px}.kpi.hero .s{color:#dbe4f5}
.kpi.ref .v{font-size:24px;color:var(--ink2)}
.take{background:var(--blue-soft);border-color:#d7e2f6}
.take .l{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--navy2)}
.take p{margin:6px 0 0;font-size:13.5px;line-height:1.65}
.take b{color:var(--navy)}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--new);border-radius:4px;padding:1px 6px;vertical-align:1px;margin-left:5px}
.grid{display:grid;gap:12px;margin-top:12px}
.g2{grid-template-columns:1fr 1fr}
.g-map{grid-template-columns:1.7fr 1fr}
.map{position:relative}
.map svg{width:100%;height:auto;display:block}
.map path{fill:#e7ecf4;stroke:#fff;stroke-width:inherit}
.map path.on{cursor:pointer}
.map path.on:hover{opacity:.8}
.map .bub{fill:rgba(11,37,89,.18);stroke:var(--navy2);stroke-width:1;cursor:pointer}
.map text,.map rect{pointer-events:none}
.map .lab{font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.map .lab2{font-weight:500;fill:var(--ink2);paint-order:stroke;stroke:#fff;stroke-width:3px}
.map .nb{fill:var(--new)}.map .nbt{fill:#fff;font-weight:800}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid #f0f2f6}
th{font-size:11.5px;color:var(--mute);font-weight:600}
th.l,td.l{text-align:left}
tr.go{cursor:pointer}tr.go:hover td{background:var(--soft)}
.rk{color:var(--mute);font-weight:700;width:18px}
.mx{overflow-x:auto}
.mx table{border-collapse:separate;border-spacing:3px}
.mx th{white-space:normal;line-height:1.3;vertical-align:bottom;font-size:11.5px;min-width:78px}
.mx th .sw{display:block;height:3px;border-radius:2px;margin-bottom:5px}
.mx td{border:0;border-radius:4px;text-align:center;font-weight:600;padding:6px 4px;background:#f6f8fb}
.mx td.l{background:none;text-align:left;font-weight:500;padding-left:2px}
.mx td.tot{background:none;font-weight:800;color:var(--navy);text-align:right}
.mx tr.oth td.l{color:var(--mute)}
.bars .b{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1.4fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.bars .b .nm{display:flex;align-items:center;gap:7px;overflow:hidden}
.bars .b .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bars .t{height:10px;background:#f1f4f8;border-radius:99px;overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:99px}
.bars .v{text-align:right;white-space:nowrap}
.bars .v b{display:inline-block;min-width:42px}
.opp{background:linear-gradient(0deg,#fff,#fff);border:1.5px solid var(--navy2)}
.opps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.op{background:var(--soft);border-radius:10px;padding:12px 14px;min-width:0}
.op .l{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--navy2)}
.op .v{font-size:19px;font-weight:800;color:var(--navy);margin-top:4px;line-height:1.3}
.op .s{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.55}
.op.new{background:#fff1f3}.op.new .l{color:var(--new)}
.cbox{position:relative;height:190px}
.bigs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.big{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:16px;transition:background .12s}
.big:hover{background:var(--soft)}
.big .e{font-size:24px;line-height:1}.big b{display:block;font-size:15px;color:var(--navy)}.big .d{display:block;color:var(--mute);font-size:12.5px;line-height:1.5}
details.fold{margin-top:22px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:center;padding:6px 4px;border-radius:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:hover{background:var(--soft)}
details.fold>summary h2{margin:0;font-size:15px;color:var(--navy)}
details.fold>summary .arr{color:var(--mute);font-size:12px;transition:transform .15s}
details.fold[open]>summary .arr{transform:rotate(90deg)}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.step{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink2)}.step b{display:block;color:var(--ink);font-size:13.5px}
ul.facts{margin:6px 0 0;padding-left:20px;color:var(--ink2);font-size:13.5px}
.note{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.6}
.err{background:#fef3f2;border:1px solid #fecdca;color:#7a271a;border-radius:10px;padding:16px 18px;margin-top:20px}
@media(max-width:1000px){.row1{grid-template-columns:1fr 1fr}.row1 .take{grid-column:1/-1}.g-map{grid-template-columns:1fr}.opps{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.page{padding:20px 14px 48px}.top h1{font-size:23px}.g2,.bigs,.flow{grid-template-columns:1fr}.opps{grid-template-columns:1fr}.kpi .v{font-size:28px}.kpi.hero .v{font-size:34px}.hide-m{display:none}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div><h1>EXPORT INTELLIGENCE <span id="hm">|</span></h1>
      <div class="sub">어디로 수출했는지, 어떤 첨가제가 나갔는지, 어디서 새 시장이 열렸는지</div></div>
    <div class="r"><span class="meta" id="meta"></span><select id="mon" aria-label="월 선택"></select></div>
  </div>
  <div id="app"></div>
</div>

<script>
/* External link slots — fill in url to show them */
const EXTERNAL_LINKS=[
  {emoji:'📝',label:'Notion 워크스페이스',url:''},
  {emoji:'🏢',label:'회사 홈페이지',url:''},
];
const D='dashboard.html';
const dl=o=>D+'#'+Object.entries(o).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
const NUM_MT=kg=>(kg/1000).toLocaleString(undefined,{maximumFractionDigits:kg<100000?1:0});
const hasB=w=>{const ch=String(w).trim().slice(-1).charCodeAt(0);return ch>=0xAC00&&ch<=0xD7A3&&(ch-0xAC00)%28>0};
const joinKo=a=>a.join('·');
let CN={},DATA=null,EST=[],chart=null;

function analyse(M){
  const L=parseM(M),prevM=mkey(addM(L,-1));
  const cur=EST.filter(r=>r.m===M);
  const before=new Set(EST.filter(r=>{const k=r.m;return k<M&&k>=mkey(addM(L,-12))}).map(r=>r.c));
  const prevSet=new Set(EST.filter(r=>r.m===prevM).map(r=>r.c));
  const C={};   // per country
  for(const r of cur){const o=C[r.c]=C[r.c]||{c:r.c,kg:0,usd:0,g:{}};o.kg+=r.kg;o.usd+=r.usd;const g=groupOf(r.cands[0].n).id;o.g[g]=(o.g[g]||0)+r.kg}
  const countries=Object.values(C).sort((a,b)=>b.kg-a.kg);
  for(const o of countries){o.isNew=!before.has(o.c);o.main=GROUPS.find(g=>g.id===Object.keys(o.g).sort((a,b)=>o.g[b]-o.g[a])[0])}
  const G={};   // per product group
  for(const o of countries)for(const [g,kg] of Object.entries(o.g)){const x=G[g]=G[g]||{g:GROUPS.find(t=>t.id===g),kg:0,cs:[]};x.kg+=kg;x.cs.push(o.c)}
  const groups=Object.values(G).sort((a,b)=>b.kg-a.kg);
  const W=countries.reduce((s,o)=>s+o.kg,0);
  return{M,prevM,cur,countries,groups,W,newC:countries.filter(o=>o.isNew),active:countries.length,prevActive:prevSet.size};
}

function render(){
  const M=$('#mon').value,A=analyse(M),nm=c=>esc(CN[c]||c),plain=c=>CN[c]||c;
  $('#hm').textContent=`| ${korM(M)}`;
  if(!A.cur.length){$('#app').innerHTML=`<div class="err">${korM(M)}에는 사료첨가제 수출 실적이 없습니다.</div>`;return}
  const {countries,groups,W,newC}=A,top=groups[0],widest=[...groups].sort((a,b)=>b.cs.length-a.cs.length||b.kg-a.kg)[0];
  const newTag=o=>o.isNew?'<span class="badge">NEW</span>':'';
  const pct=kg=>`${(kg/W*100).toFixed(0)}%`;
  const per='m:'+M.replace('.','');

  // ── Key takeaway (auto)
  let take='';
  if(newC.length){const n=newC[0];take+=`<b>${esc(plain(n.c))}</b>${hasB(plain(n.c))?'이':'가'} <b>${NUM_MT(n.kg)} MT</b> 신규 시장으로 들어왔고, 주로 <b>${esc(n.main.k)}</b>${hasB(n.main.k)?'으로':'로'} 추정됩니다. `;
    if(newC.length>1)take+=`그 밖에 ${joinKo(newC.slice(1).map(o=>esc(plain(o.c))))}도 새로 들어왔습니다. `}
  if(top)take+=`<b>${esc(top.g.k)}</b>${hasB(top.g.k)?'이':'가'} 전체 물량의 <b>${pct(top.kg)}</b>(${NUM_MT(top.kg)} MT)를 차지하며 ${joinKo(top.cs.slice(0,3).map(c=>esc(plain(c))))}${top.cs.length>3?' 등':''}${hasB(plain(top.cs[Math.min(2,top.cs.length-1)]))?'으로':'로'} 나갔습니다.`;

  let h=`<div class="row1">
    <a class="card kpi hero" href="#opp"><div class="l">신규 시장</div><div class="v num">${newC.length}</div><div class="s">${newC.length?newC.slice(0,2).map(o=>`${esc(plain(o.c))} · ${NUM_MT(o.kg)} MT`).join('<br>'):'이번 달 신규 시장 없음'}</div></a>
    <div class="card kpi"><div class="l">활성 시장</div><div class="v num">${A.active}</div><div class="s">${A.prevActive?`<span class="${A.active>=A.prevActive?'':'down'}" style="color:${A.active>=A.prevActive?'var(--up)':'var(--down)'};font-weight:700">${A.active-A.prevActive>=0?'+':''}${A.active-A.prevActive}</span> vs ${korM(A.prevM).replace(/^\d+년 /,'')}`:'개국'}</div></div>
    <div class="card kpi"><div class="l">제품 카테고리</div><div class="v num">${groups.length}</div><div class="s">단가 기반 추정 분류</div></div>
    <div class="card kpi ref"><div class="l">총 물량</div><div class="v num">${NUM_MT(W)} MT</div><div class="s">참고용</div></div>
    <div class="card take"><div class="l">💡 KEY TAKEAWAY</div><p>${take}</p></div>
  </div>`;

  // ── Map + top tables
  const tier=kg=>kg>=50000?'#0b2559':kg>=10000?'#3b6fc9':kg>=1000?'#9db9e8':'#d6e2f6';
  const byC=Object.fromEntries(countries.map(o=>[o.c,o]));
  // Zoom to the countries exported this month (with padding), keeping a wide aspect
  const pts=countries.map(o=>WORLD.C[o.c]).filter(Boolean);
  let x0=Math.min(...pts.map(p=>p[0]))-60,x1=Math.max(...pts.map(p=>p[0]))+90,y0=Math.min(...pts.map(p=>p[1]))-45,y1=Math.max(...pts.map(p=>p[1]))+45;
  const minW=380;if(x1-x0<minW){const cx=(x0+x1)/2;x0=cx-minW/2;x1=cx+minW/2}
  const asp=.48;if((y1-y0)<(x1-x0)*asp){const cy=(y0+y1)/2,hh=(x1-x0)*asp;y0=cy-hh/2;y1=cy+hh/2}else{const cx=(x0+x1)/2,ww=(y1-y0)/asp;x0=cx-ww/2;x1=cx+ww/2}
  x0=Math.max(0,x0);y0=Math.max(0,y0);x1=Math.min(WORLD.w,x1);y1=Math.min(WORLD.h,y1);
  const vw=x1-x0,k=vw/1080;   // user units per screen px at full card width
  const maxKg=countries[0].kg,R=kg=>(3+Math.sqrt(kg/maxKg)*20)*k*1.6;
  const labels=countries.filter(o=>WORLD.C[o.c]).slice(0,10);
  let svg=`<svg viewBox="${x0.toFixed(0)} ${y0.toFixed(0)} ${vw.toFixed(0)} ${(y1-y0).toFixed(0)}" role="img" aria-label="나라별 수출 물량 지도" style="stroke-width:${k}">`;
  for(const d of WORLD.O)svg+=`<path d="${d}"/>`;
  for(const [c,d] of Object.entries(WORLD.P))svg+=byC[c]?`<path class="on" d="${d}" style="fill:${tier(byC[c].kg)}" data-c="${c}"><title>${nm(c)} · ${NUM_MT(byC[c].kg)} MT</title></path>`:`<path d="${d}"/>`;
  for(const o of countries){const p=WORLD.C[o.c];if(p)svg+=`<circle class="bub" data-c="${o.c}" cx="${p[0]}" cy="${p[1]}" r="${R(o.kg).toFixed(2)}" style="stroke-width:${(1.2*k).toFixed(2)}"><title>${nm(o.c)} · ${NUM_MT(o.kg)} MT</title></circle>`}
  // Greedy label placement: try right / left / above / below the bubble, skip spots that overlap earlier labels or bubbles
  const fs=12.5*k,fs2=11*k,placed=[],bubs=countries.map(o=>WORLD.C[o.c]?{x:WORLD.C[o.c][0],y:WORLD.C[o.c][1],r:R(o.kg)}:null).filter(Boolean);
  const hit=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
  for(const o of labels){const[x,y]=WORLD.C[o.c],r=R(o.kg),name=CN[o.c]||o.c;
    const w=Math.max(name.length*fs*.98,(NUM_MT(o.kg).length+3)*fs2*.6)+(o.isNew?32*k:0),hgt=fs+fs2+4*k,g=4*k;
    const opts=[{x:x+r+g,y:y-hgt/2},{x:x-r-g-w,y:y-hgt/2},{x:x-w/2,y:y-r-g-hgt},{x:x-w/2,y:y+r+g}];
    const box=opts.map(b=>({...b,w,h:hgt})).find(b=>!placed.some(q=>hit(b,q))&&!bubs.some(c=>c.x!==x&&hit(b,{x:c.x-c.r,y:c.y-c.r,w:2*c.r,h:2*c.r})))||null;
    if(!box)continue;placed.push(box);
    svg+=`<text class="lab" x="${box.x}" y="${box.y+fs}" style="font-size:${fs}px;stroke-width:${3*k}px">${esc(name)}</text><text class="lab2" x="${box.x}" y="${box.y+fs+fs2+2*k}" style="font-size:${fs2}px;stroke-width:${3*k}px">${NUM_MT(o.kg)} MT</text>`;
    if(o.isNew){const bx=box.x+name.length*fs*.98+4*k,by=box.y+1*k;svg+=`<rect class="nb" x="${bx}" y="${by}" width="${28*k}" height="${13*k}" rx="${3*k}"/><text class="nbt" x="${bx+14*k}" y="${by+9.6*k}" text-anchor="middle" style="font-size:${9*k}px">NEW</text>`}}
  svg+='</svg>';
  const rankTable=(list,val,head)=>`<table><thead><tr><th class="l">#</th><th class="l">나라</th><th>${head}</th><th>비중</th><th></th></tr></thead><tbody>${list.map((o,i)=>`<tr class="go" data-href="${dl({c:o.c,per})}"><td class="l rk">${i+1}</td><td class="l"><b>${nm(o.c)}</b></td><td class="num"><b>${val(o)}</b></td><td class="num" style="color:var(--mute)">${o.share}</td><td>${newTag(o)}</td></tr>`).join('')}</tbody></table>`;
  const U=countries.reduce((s,o)=>s+o.usd,0);
  const byVol=countries.slice(0,5).map(o=>({...o,share:pct(o.kg)}));
  const byVal=[...countries].sort((a,b)=>b.usd-a.usd).slice(0,5).map(o=>({...o,share:`${(o.usd/U*100).toFixed(0)}%`}));
  h+=`<div class="card" style="margin-top:12px"><div class="ttl"><h2>나라별 수출 물량</h2><span class="u">MT · 원 크기 = 물량 · 이번 달 수출국 영역으로 확대 · 누르면 그 나라 상세</span></div>
      <div class="map">${svg}</div>
      <div class="legend"><span><i style="background:#0b2559"></i>50 MT 이상</span><span><i style="background:#3b6fc9"></i>10–50</span><span><i style="background:#9db9e8"></i>1–10</span><span><i style="background:#d6e2f6"></i>1 미만</span><span>· 라벨은 겹치지 않는 상위 국가만</span></div></div>
    <div class="grid g2">
      <div class="card"><div class="ttl"><h2>물량 Top 5</h2><span class="u">MT</span><a class="more" href="${dl({scope:'all',per})}">전체 보기 ›</a></div>${rankTable(byVol,o=>NUM_MT(o.kg),'물량')}</div>
      <div class="card"><div class="ttl"><h2>금액 Top 5</h2><span class="u">USD</span><a class="more" href="${dl({scope:'all',per})}">전체 보기 ›</a></div>${rankTable(byVal,o=>fUSD(o.usd),'금액')}</div>
    </div>`;

  // ── Product × country matrix (the core view)
  const MAXROWS=10,rows=countries.slice(0,MAXROWS),rest=countries.slice(MAXROWS);
  const cellMax=Math.max(...countries.flatMap(o=>Object.values(o.g)));
  const cell=(g,kg)=>{if(!kg)return'<td></td>';const a=.14+.76*Math.sqrt(kg/cellMax);
    return`<td style="background:${g.c}${Math.round(a*255).toString(16).padStart(2,'0')};color:${a>.55?'#fff':'var(--ink)'}">${NUM_MT(kg)}</td>`};
  const oth=rest.length?rest.reduce((o,x)=>{o.kg+=x.kg;for(const[g,v]of Object.entries(x.g))o.g[g]=(o.g[g]||0)+v;return o},{kg:0,g:{}}):null;
  h+=`<div class="card" style="margin-top:12px"><div class="ttl"><h2>나라별 추정 제품 구성</h2><span class="u">MT · 칸 색이 진할수록 물량이 많음 · 행을 누르면 그 나라 상세</span><a class="more" href="trends.html">첨가제별 동향 ›</a></div>
    <div class="mx"><table><thead><tr><th class="l">나라</th>${groups.map(x=>`<th><span class="sw" style="background:${x.g.c}"></span>${esc(x.g.k)}</th>`).join('')}<th style="text-align:right">합계</th></tr></thead><tbody>
    ${rows.map(o=>`<tr class="go" data-href="${dl({c:o.c,per})}"><td class="l"><b>${nm(o.c)}</b>${newTag(o)}</td>${groups.map(x=>cell(x.g,o.g[x.g.id])).join('')}<td class="tot num">${NUM_MT(o.kg)}</td></tr>`).join('')}
    ${oth?`<tr class="oth"><td class="l">그 외 ${rest.length}개국</td>${groups.map(x=>cell(x.g,oth.g[x.g.id])).join('')}<td class="tot num">${NUM_MT(oth.kg)}</td></tr>`:''}
    </tbody></table></div>
    <div class="note">제품은 수출 단가(USD/kg)를 사료첨가제 벌크 거래 단가대에 대입한 <b>추정</b>입니다. 한 나라·한 세부코드 안에 여러 제품이 섞이면 평균 단가로 분류됩니다.</div></div>`;

  // ── Product distribution: volume + coverage
  const cov=[...groups].sort((a,b)=>b.cs.length-a.cs.length||b.kg-a.kg),maxCov=cov[0].cs.length;
  h+=`<div class="grid g2">
    <div class="card"><div class="ttl"><h2>제품별 물량</h2><span class="u">합계 ${NUM_MT(W)} MT</span></div><div class="bars">
      ${groups.map(x=>`<div class="b"><span class="nm"><i class="dot" style="background:${x.g.c}"></i><span>${esc(x.g.k)}</span></span><span class="t"><i style="width:${x.kg/groups[0].kg*100}%;background:${x.g.c}"></i></span><span class="v num">${NUM_MT(x.kg)} MT <b>${pct(x.kg)}</b></span></div>`).join('')}</div></div>
    <div class="card"><div class="ttl"><h2>제품별 진출 국가 수</h2><span class="u">시장 침투 범위</span></div><div class="bars">
      ${cov.map(x=>`<div class="b" title="${x.cs.map(plain).join(', ')}"><span class="nm"><i class="dot" style="background:${x.g.c}"></i><span>${esc(x.g.k)}</span></span><span class="t"><i style="width:${x.cs.length/maxCov*100}%;background:${x.g.c}"></i></span><span class="v num"><b>${x.cs.length}</b>개국</span></div>`).join('')}</div></div>
  </div>`;

  // ── Opportunities
  const narrow=groups.filter(x=>x.cs.length<=2);
  const cross=x=>countries.filter(o=>!x.cs.includes(o.c)).slice(0,3).map(o=>plain(o.c));
  h+=`<div class="card opp" id="opp" style="margin-top:12px"><div class="ttl"><h2>신규 시장 · 제품 확장 기회</h2><span class="u">${korM(M)} 데이터에서 자동 도출</span></div><div class="opps">
    <div class="op new"><div class="l">신규 시장</div>${newC.length?newC.slice(0,3).map(o=>`<div class="v">${nm(o.c)} <span style="font-size:14px">${NUM_MT(o.kg)} MT</span></div><div class="s">주로 ${esc(o.main.k)}</div>`).join(''):'<div class="s">이번 달 새로 들어온 나라가 없습니다. (이전 12개월 기준)</div>'}</div>
    <div class="op"><div class="l">물량 집중</div><div class="v">${joinKo(top.cs.slice(0,2).map(c=>nm(c)))}${top.cs.length>2?` 외 ${top.cs.length-2}`:''}</div><div class="s">${esc(top.g.k)} ${NUM_MT(top.kg)} MT · 전체의 <b>${pct(top.kg)}</b></div></div>
    <div class="op"><div class="l">가장 넓게 팔린 제품</div><div class="v">${esc(widest.g.k)}</div><div class="s"><b>${widest.cs.length}개국</b> · ${widest.cs.slice(0,4).map(c=>nm(c)).join(', ')}${widest.cs.length>4?' 등':''}</div></div>
    <div class="op"><div class="l">교차 판매 후보</div>${narrow.length?narrow.slice(0,2).map(x=>`<div class="s"><b>${esc(x.g.k)}</b> — 지금 ${x.cs.map(c=>nm(c)).join('·')}${x.cs.length===1?'만':''} → ${esc(joinKo(cross(x)))}에 제안 검토</div>`).join(''):'<div class="s">모든 제품이 3개국 이상에 나갔습니다.</div>'}</div>
  </div></div>`;

  // ── Monthly trend (supporting)
  h+=`<div class="card" style="margin-top:12px"><div class="ttl"><h2>월별 수출 물량</h2><span class="u">최근 12개월 · MT · 참고 · 막대를 누르면 그 달로</span></div><div class="cbox"><canvas id="ch"></canvas></div></div>`;

  // ── Detail pages
  const big=(e,l,d,href)=>`<a class="big" href="${href}"><span class="e">${e}</span><span><b>${l}</b><span class="d">${d}</span></span></a>`;
  h+=`<div class="bigs">${big('📊','세부 수출기록 확인하기','나라·지역·세부 품목·월별 수출 기록',dl({scope:'all',per}))}${big('📈','첨가제별 동향','추정 첨가제 유형별 월별 물량·단가·주요 국가','trends.html')}${big('🔎','제품 추정 시나리오','단일 제품으로 보이는 건의 추정 근거','scenario.html')}</div>`;

  // ── Data explanation (folded)
  h+=`<details class="fold" id="about"><summary><span class="arr">▶</span><h2>📘 이 데이터는 어디서 오나요?</h2><span class="u" style="color:var(--mute);font-size:12px">누르면 펼쳐집니다</span></summary>
    <p style="color:var(--ink2);margin:8px 0 0">우리나라에서 물건을 해외로 팔 때는 반드시 <b>세관(관세청)에 수출신고</b>를 해야 합니다. 신고서에는 <b>무슨 물건인지(HS코드)</b>, <b>어느 나라로</b>, <b>몇 kg</b>, <b>얼마(달러)</b>에 보내는지가 적힙니다. 관세청은 이 신고서를 매달 모아 합계를 공개하고, 이 페이지는 그 공개 자료를 자동으로 불러와 보여줍니다.</p>
    <div class="flow"><div class="step"><b>① 수출신고</b>회사가 세관에 품목·나라·무게·금액 신고</div><div class="step"><b>② 관세청 집계</b>한 달 신고를 나라별·품목별로 합산</div><div class="step"><b>③ 공공데이터 공개</b>매달 15일쯤 지난달 통계 공개</div><div class="step"><b>④ 이 페이지</b>매달 16~20일 '사료첨가제'만 자동 정리</div></div>
    <ul class="facts"><li><b>HS 2309.90-30</b> = 관세율표상 '사료첨가제'. 세부 품목: ${Object.values(ITEM_LABEL).join(' · ')}</li><li>회사별 내역은 비공개이며 <b>한국 전체의 합계</b>입니다.</li><li>평균단가 = 금액 ÷ 중량 (USD/kg). 신고 금액은 FOB 기준입니다.</li>
    <li>데이터 ${esc(DATA.latest)}까지 · 마지막 갱신 ${esc(DATA.updated)} · 출처 <a href="${LINK}" target="_blank" rel="noopener" style="text-decoration:underline">공공데이터포털</a></li></ul></details>`;
  const ext=EXTERNAL_LINKS.filter(x=>x.url);
  if(ext.length)h+=`<div class="bigs">${ext.map(x=>big(x.emoji,esc(x.label),esc(x.url),esc(x.url))).join('')}</div>`;

  $('#app').innerHTML=h;
  document.querySelectorAll('[data-href]').forEach(el=>el.onclick=()=>location.href=el.dataset.href);
  document.querySelectorAll('.map [data-c]').forEach(el=>el.onclick=()=>location.href=dl({c:el.dataset.c,per}));

  // Monthly volume chart, selected month highlighted with its value
  const months=Array.from({length:12},(_,i)=>mkey(addM(parseM(M),i-11)));
  const vals=months.map(m=>EST.filter(r=>r.m===m).reduce((s,r)=>s+r.kg,0)/1000);
  chart?.destroy();
  chart=new Chart($('#ch'),{type:'bar',data:{labels:months.map(m=>{const[y,mm]=parseM(m);return`${mm}월 '${String(y).slice(2)}`}),datasets:[{data:vals,backgroundColor:months.map(m=>m===M?'#0b2559':'#b9cdee'),borderRadius:4}]},
    options:{maintainAspectRatio:false,layout:{padding:{top:22}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.y.toLocaleString(undefined,{maximumFractionDigits:1})} MT`}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{border:{display:false},grid:{color:'#f0f2f6'},ticks:{font:{size:11}}}},
      onHover:(e,els)=>{e.native.target.style.cursor=els.length?'pointer':'default'},
      onClick:(e,els)=>{if(els.length){$('#mon').value=months[els[0].index];if($('#mon').value===months[els[0].index])render()}}},
    plugins:[{id:'hl',afterDatasetsDraw(c){const i=months.indexOf(M),el=c.getDatasetMeta(0).data[i];if(!el)return;const x=c.ctx;x.save();x.font='700 12px sans-serif';x.fillStyle='#0b2559';x.textAlign='center';x.fillText(`${vals[i].toLocaleString(undefined,{maximumFractionDigits:1})} MT`,el.x,el.y-6);x.restore()}}]});
}

if(location.protocol==='file:')$('#app').innerHTML='<div class="err"><b>파일을 직접 열면 데이터를 읽을 수 없습니다.</b> GitHub Pages 주소로 접속하거나, 이 폴더에서 <code>python -m http.server</code> 실행 후 http://localhost:8000 으로 여세요.</div>';
else loadData().then(({CN:c,DATA:d})=>{CN=c;DATA=d;
  EST=estimateRows(d.rows.map(([m,c,h,usd,kg])=>({m,c,h,usd,kg})));
  const L=parseM(d.latest);
  $('#mon').innerHTML=Array.from({length:12},(_,i)=>mkey(addM(L,-i))).map(m=>`<option value="${m}">${korM(m)}</option>`).join('');
  $('#meta').textContent=`HS 2309.90-30 · 갱신 ${d.updated}`;
  $('#mon').onchange=render;
  if(location.hash==='#about')setTimeout(()=>{$('#about').open=true;$('#about').scrollIntoView()},0);
  render();
}).catch(()=>{$('#app').innerHTML='<div class="err"><b>아직 데이터가 만들어지지 않았습니다.</b><br>관세청 데이터 파일(data/feed_additive.json)이 생성되기 전입니다. GitHub 저장소의 Actions 탭 → <b>Update customs data</b> → <b>Run workflow</b>를 실행하고 몇 분 뒤 새로고침해 주세요.</div>'});
</script>
</body>
</html>
