name: Update customs data

# 관세청 실적은 매월 15일경 전월분이 반영되므로 매월 16~20일 오전 10시(KST)에 갱신을 시도합니다.
# Actions 탭에서 'Run workflow' 버튼으로 언제든 수동 실행할 수 있습니다.
on:
  schedule:
    - cron: "0 1 16-20 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data from data.go.kr
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python feed-additive-dashboard/scripts/fetch_data.py
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed-additive-dashboard/data/feed_additive.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 관세청 사료첨가제 수출 데이터 갱신"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN으로 한 push는 다른 워크플로를 깨우지 않으므로 Pages 배포를 직접 실행합니다.
      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "${{ github.ref_name }}"
