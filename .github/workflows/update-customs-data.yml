name: Update customs data

# 관세청 실적은 매월 15일경 전월분이 반영되므로 매월 16~20일 오전 10시(KST)에 갱신을 시도합니다.
# Actions 탭에서 'Run workflow' 버튼으로 언제든 수동 실행할 수 있습니다.
on:
  schedule:
    - cron: "0 1 16-20 * *"
  workflow_dispatch:
  # 수집 스크립트나 이 워크플로를 바꿔 기본 브랜치에 반영하면 바로 한 번 실행합니다.
  push:
    branches: [claude/optimistic-brahmagupta-uhwtyu]
    paths:
      - feed-additive-dashboard/scripts/**
      - .github/workflows/update-customs-data.yml

permissions:
  contents: write
  actions: write

jobs:
  update:
    # data.go.kr이 GitHub 서버(해외)에서 온 요청을 거절하므로, 국내 PC에 설치한 self-hosted runner에서 실행합니다.
    # PC가 꺼져 있으면 켜질 때까지(최대 24시간) 대기했다가 실행됩니다. 설치 방법은 feed-additive-dashboard/README.md 참고.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data from data.go.kr
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python feed-additive-dashboard/scripts/fetch_data.py
      # git 없이 GitHub API로 데이터 파일을 올리고 Pages 배포를 다시 실행합니다.
      - name: Publish data and redeploy Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python feed-additive-dashboard/scripts/publish_data.py
